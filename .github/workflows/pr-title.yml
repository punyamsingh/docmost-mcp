name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is type, colon, description
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert)(\([a-z0-9-]+\))?!?: [a-z0-9_`].*[^.]$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "PR title ok: $TITLE"
          else
            echo "::error::PR title \"$TITLE\" must look like \"type: description\" or \"type(scope): description\"."
            echo "Types: feat, fix, perf, refactor, docs, test, ci, build, chore, revert."
            echo "Start the description in lowercase and leave off the trailing full stop."
            exit 1
          fi
