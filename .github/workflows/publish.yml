name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      - name: Check whether this version is already on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          tagged=$(git ls-remote --tags origin "refs/tags/v$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$version" ] || [ -n "$tagged" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already released; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish

      - name: Tag the release
        if: steps.version.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "refs/tags/v${{ steps.version.outputs.version }}"

      - name: Check whether this version is already in the MCP Registry
        id: registry
        run: |
          name=$(node -p "require('./server.json').name")
          version=$(node -p "require('./server.json').version")
          if [ "$version" != "${{ steps.version.outputs.version }}" ]; then
            echo "server.json is at $version but package.json is at ${{ steps.version.outputs.version }}; bump both."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/$version")
          if [ "$status" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name $version is already in the MCP Registry; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the MCP Registry
        if: steps.registry.outputs.publish == 'true'
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            echo "Attempt $attempt failed; npm may not list the new version yet. Retrying in 30 s."
            sleep 30
          done
          exit 1
